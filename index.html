<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FANGAMEX Key Admin Panel</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;padding:18px;background:#101522;
 color:white;font-family:Arial,sans-serif
}
.container{max-width:550px;margin:auto}
h1{text-align:center;color:#ff4081}
.card{
 background:#1c2638;padding:18px;
 border-radius:14px;margin:15px 0
}
input,select,button{
 width:100%;padding:13px;margin:8px 0;
 border:0;border-radius:8px;font-size:15px
}
input,select{background:white;color:#111}
button{
 background:#ff4081;color:white;
 font-weight:bold;cursor:pointer
}
button:disabled{opacity:.5}
.secondary{background:#34445e}
.danger{background:#c62828}
.key{
 background:#101522;padding:12px;
 border-radius:8px;margin:10px 0;
 overflow-wrap:anywhere
}
.small{font-size:12px;color:#b8c3d6;line-height:1.8}
.hidden{display:none}
#message{padding:10px;color:#80ffb0;overflow-wrap:anywhere}
</style>
</head>

<body>
<div class="container">

<h1>FANGAMEX</h1>
<p style="text-align:center">KEY ADMIN PANEL</p>

<div class="card" id="loginBox">
<h3>Admin Login</h3>
<input id="email" type="email" placeholder="Admin Email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">LOGIN</button>
</div>

<div id="panel" class="hidden">

<div class="card">
<h3>नई Key बनाएँ</h3>

<input id="customKey" type="text" maxlength="32"
placeholder="अपनी Key लिखें या खाली छोड़ें">

<p class="small">
खाली छोड़ने पर Automatic Random Key बनेगी।
केवल A-Z, 0-9 और - इस्तेमाल करें।
</p>

<label>Key Duration चुनें</label>
<select id="duration">
<optgroup label="घंटे">
<option value="3600000">1 घंटा</option>
<option value="7200000">2 घंटे</option>
<option value="10800000">3 घंटे</option>
<option value="14400000">4 घंटे</option>
<option value="18000000">5 घंटे</option>
<option value="21600000">6 घंटे</option>
<option value="25200000">7 घंटे</option>
<option value="28800000">8 घंटे</option>
<option value="32400000">9 घंटे</option>
<option value="36000000">10 घंटे</option>
<option value="39600000">11 घंटे</option>
<option value="43200000">12 घंटे</option>
</optgroup>

<optgroup label="दिन">
<option value="86400000">1 दिन</option>
<option value="604800000">7 दिन</option>
<option value="1296000000">15 दिन</option>
<option value="2592000000">30 दिन</option>
</optgroup>

<optgroup label="विशेष">
<option value="-1">Lifetime</option>
</optgroup>
</select>

<button id="generateBtn">GENERATE KEY</button>

<div id="newKey" class="key hidden"></div>
<button id="copyBtn" class="secondary hidden">COPY KEY</button>
</div>

<div class="card">
<h3>सभी Keys</h3>
<p id="keyCount">Keys: 0</p>
<button id="refreshBtn" class="secondary">REFRESH</button>
<div id="keyList">Loading...</div>
</div>

<button id="logoutBtn" class="danger">LOGOUT</button>
</div>

<div id="message"></div>
</div>

<script>
const firebaseConfig = {
 apiKey: "AIzaSyC9c7lx17F3vTKuTLV9VokoeAmbMT6vaMc",
 authDomain: "aim-ai-angel.firebaseapp.com",
 databaseURL: "https://aim-ai-angel-default-rtdb.asia-southeast1.firebasedatabase.app",
 projectId: "aim-ai-angel",
 storageBucket: "aim-ai-angel.firebasestorage.app",
 messagingSenderId: "200877621483",
 appId: "1:200877621483:web:42d357d1810aef46e67eae"
};

const ADMIN_UID = "brnGMEwd4VZrp7HHwLyD3gq3QNA2";

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

const $ = id => document.getElementById(id);
let latestKey = "";

function msg(message,error=false){
 $("message").textContent=message;
 $("message").style.color=error?"#ff7777":"#80ffb0";
}

function escapeHTML(value){
 return String(value).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#39;"
 })[c]);
}

function makeKey(){
 const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
 const random=new Uint32Array(16);
 crypto.getRandomValues(random);

 let result="FANGAMEX-";
 for(let i=0;i<random.length;i++){
  result+=chars[random[i]%chars.length];
 }
 return result;
}

function adminCheck(){
 return auth.currentUser &&
 auth.currentUser.uid===ADMIN_UID;
}

function durationName(ms){
 ms=Number(ms);
 if(ms===-1)return "Lifetime";

 const hours=ms/3600000;
 if(Number.isInteger(hours)&&hours<24){
  return hours+(hours===1?" घंटा":" घंटे");
 }

 const days=ms/86400000;
 if(Number.isInteger(days))return days+" दिन";

 return "Custom अवधि";
}

function keyState(data){
 if(data.status==="disabled")return "Disabled";
 if(data.lifetime===true)return "Lifetime";

 if(data.expiresAt && Number(data.expiresAt)<=Date.now()){
  return "Expired";
 }

 if(!data.activatedAt)return "Not Activated";

 return "Active";
}

// LOGIN
$("loginBtn").onclick=async()=>{
 const email=$("email").value.trim();
 const password=$("password").value;

 if(!email||!password){
  msg("Email और Password भरें।",true);
  return;
 }

 $("loginBtn").disabled=true;

 try{
  await auth.signInWithEmailAndPassword(email,password);
 }catch(e){
  msg("Login Error: "+e.message,true);
 }finally{
  $("loginBtn").disabled=false;
 }
};

auth.onAuthStateChanged(async user=>{
 if(user&&user.uid===ADMIN_UID){
  $("loginBox").classList.add("hidden");
  $("panel").classList.remove("hidden");
  msg("Admin Login सफल।");
  await loadKeys();
 }else{
  $("loginBox").classList.remove("hidden");
  $("panel").classList.add("hidden");

  if(user){
   await auth.signOut();
   msg("यह Admin Account नहीं है।",true);
  }
 }
});

// GENERATE KEY
$("generateBtn").onclick=async()=>{
 if(!adminCheck()){
  msg("Admin Login जरूरी है।",true);
  return;
 }

 const typed=$("customKey").value.trim().toUpperCase();

 if(typed&&!/^[A-Z0-9-]{4,32}$/.test(typed)){
  msg("Key 4 से 32 अक्षरों की होनी चाहिए।",true);
  return;
 }

 const key=typed||makeKey();
 const durationMs=Number($("duration").value);
 const lifetime=durationMs===-1;

 $("generateBtn").disabled=true;

 try{
  const ref=db.ref("Keys/"+key);

  // Duplicate key से बचाव
  const result=await ref.transaction(current=>{
   if(current!==null)return;
   return {
    status:"active",
    durationMs:durationMs,
    durationDays:lifetime?0:durationMs/86400000,
    lifetime:lifetime,
    createdAt:firebase.database.ServerValue.TIMESTAMP,
    activatedBy:null,
    activatedAt:null,
    expiresAt:null
   };
  });

  if(!result.committed){
   msg("यह Key पहले से मौजूद है। दूसरी Key लिखें।",true);
   return;
  }

  latestKey=key;
  $("newKey").textContent=key+" | "+durationName(durationMs);
  $("newKey").classList.remove("hidden");
  $("copyBtn").classList.remove("hidden");
  $("customKey").value="";

  msg("नई Key सफलतापूर्वक बन गई।");
  await loadKeys();

 }catch(e){
  msg("Generate Error: "+e.message,true);
 }finally{
  $("generateBtn").disabled=false;
 }
};

// COPY
$("copyBtn").onclick=async()=>{
 if(!latestKey)return;

 try{
  await navigator.clipboard.writeText(latestKey);
  msg("Key Copy हो गई।");
 }catch(e){
  msg("Key को दबाकर Copy करें।",true);
 }
};

// LOAD KEYS
async function loadKeys(){
 if(!adminCheck())return;

 try{
  const snapshot=await db.ref("Keys").once("value");
  let html="";
  let count=0;

  snapshot.forEach(child=>{
   count++;

   const key=child.key;
   const data=child.val()||{};
   const status=keyState(data);

   const duration=data.lifetime===true
    ?"Lifetime":durationName(data.durationMs||0);

   let expiry="पहली Activation का इंतजार";

   if(data.lifetime===true){
    expiry="कभी Expire नहीं होगी";
   }else if(data.expiresAt){
    expiry=new Date(Number(data.expiresAt)).toLocaleString();
   }

   const created=data.createdAt
    ?new Date(Number(data.createdAt)).toLocaleString()
    :"Unknown";

   const encoded=encodeURIComponent(key);

   html+=`
   <div class="key">
    <b>${escapeHTML(key)}</b><br>
    <span class="small">
     अवधि: ${escapeHTML(duration)}<br>
     Status: ${escapeHTML(status)}<br>
     Created: ${escapeHTML(created)}<br>
     Expiry: ${escapeHTML(expiry)}
    </span>

    <button class="secondary"
     onclick="toggleKey('${encoded}')">
     ${data.status==="active"?"DISABLE":"ENABLE"}
    </button>

    <button class="danger"
     onclick="deleteKey('${encoded}')">
     DELETE KEY
    </button>
   </div>`;
  });

  $("keyCount").textContent="कुल Keys: "+count;
  $("keyList").innerHTML=html||"अभी कोई Key नहीं है।";

 }catch(e){
  msg("Load Error: "+e.message,true);
 }
}

// ENABLE / DISABLE
window.toggleKey=async encoded=>{
 if(!adminCheck())return;

 const key=decodeURIComponent(encoded);

 try{
  const ref=db.ref("Keys/"+key+"/status");
  const snapshot=await ref.once("value");
  const current=snapshot.val();

  await ref.set(current==="active"?"disabled":"active");

  msg("Key Status बदल गया।");
  await loadKeys();
 }catch(e){
  msg("Status Error: "+e.message,true);
 }
};

// DELETE
window.deleteKey=async encoded=>{
 if(!adminCheck())return;

 const key=decodeURIComponent(encoded);

 if(!confirm("क्या आप इस Key को Delete करना चाहते हैं?"))return;

 try{
  await db.ref("Keys/"+key).remove();
  msg("Key Delete हो गई।");
  await loadKeys();
 }catch(e){
  msg("Delete Error: "+e.message,true);
 }
};

// REFRESH
$("refreshBtn").onclick=loadKeys;

// LOGOUT
$("logoutBtn").onclick=async()=>{
 await auth.signOut();
 msg("Logout हो गया।");
};
</script>
</body>
</html>
