
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FANGAMEX Key Panel</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;padding:18px;
  background:#101522;color:white;
  font-family:Arial,sans-serif
}
.container{max-width:550px;margin:auto}
h1{text-align:center;color:#ff4081}
.card{
  background:#1c2638;padding:18px;
  border-radius:14px;margin:15px 0
}
input,select,button{
  width:100%;padding:13px;margin:8px 0;
  border:0;border-radius:8px;font-size:15px
}
input,select{background:#fff;color:#111}
button{
  background:#ff4081;color:white;
  font-weight:bold;cursor:pointer
}
button:disabled{opacity:.5}
.secondary{background:#34445e}
.danger{background:#c62828}
.key{
  background:#101522;padding:12px;
  border-radius:8px;margin:10px 0;
  overflow-wrap:anywhere
}
.small{font-size:12px;color:#b8c3d6}
.hidden{display:none}
#message{padding:10px;color:#ffd180}
</style>
</head>

<body>
<div class="container">

<h1>FANGAMEX</h1>
<p style="text-align:center">KEY ADMIN PANEL</p>

<div class="card" id="loginBox">
<h3>Admin Login</h3>
<input id="email" type="email" placeholder="Admin Email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">LOGIN</button>
</div>

<div id="panel" class="hidden">

<div class="card">
<h3>नई Key बनाएँ</h3>

<input id="customKey" type="text"
placeholder="अपनी Key लिखें जैसे FANGAMEX123"
maxlength="32">

<p class="small">
खाली छोड़ने पर Automatic Key बनेगी।
केवल A-Z, 0-9 और - इस्तेमाल करें।
</p>

<select id="duration">
<option value="1">1 दिन</option>
<option value="7">7 दिन</option>
<option value="15">15 दिन</option>
<option value="30">30 दिन</option>
</select>

<button id="generateBtn">GENERATE KEY</button>

<div id="newKey" class="key hidden"></div>
<button id="copyBtn" class="secondary hidden">COPY KEY</button>
</div>

<div class="card">
<h3>सभी Keys</h3>
<p id="keyCount">Keys: 0</p>
<button id="refreshBtn" class="secondary">REFRESH</button>
<div id="keyList">Loading...</div>
</div>

<button id="logoutBtn" class="danger">LOGOUT</button>
</div>

<div id="message"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC9c7lx17F3vTKuTLV9VokoeAmbMT6vaMc",
  authDomain: "aim-ai-angel.firebaseapp.com",
  databaseURL: "https://aim-ai-angel-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "aim-ai-angel",
  storageBucket: "aim-ai-angel.firebasestorage.app",
  messagingSenderId: "200877621483",
  appId: "1:200877621483:web:42d357d1810aef46e67eae",
  measurementId: "G-P9DFJ0WZ8Y"
};

const ADMIN_UID = "brnGMEwd4VZrp7HHwLyD3gq3QNA2";

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

const $ = id => document.getElementById(id);

let latestKey = "";

function msg(message, error=false){
  $("message").textContent = message;
  $("message").style.color = error ? "#ff7777" : "#80ffb0";
}

function makeKey(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let result = "FANGAMEX-";
  for(let i=0;i<12;i++){
    result += chars[Math.floor(Math.random()*chars.length)];
  }
  return result;
}

function adminCheck(){
  return auth.currentUser &&
         auth.currentUser.uid === ADMIN_UID;
}

$("loginBtn").onclick = async()=>{
  const email = $("email").value.trim();
  const password = $("password").value;

  if(!email || !password){
    msg("Email और Password भरें।",true);
    return;
  }

  try{
    await auth.signInWithEmailAndPassword(email,password);
  }catch(e){
    msg("Login Error: "+e.message,true);
  }
};

auth.onAuthStateChanged(async user=>{
  if(user && user.uid === ADMIN_UID){
    $("loginBox").classList.add("hidden");
    $("panel").classList.remove("hidden");
    msg("Admin Login सफल।");
    await deleteExpiredKeys();
    await loadKeys();
  }else{
    $("loginBox").classList.remove("hidden");
    $("panel").classList.add("hidden");

    if(user){
      await auth.signOut();
      msg("यह Admin Account नहीं है।",true);
    }
  }
});

$("generateBtn").onclick = async()=>{
  if(!adminCheck()){
    msg("Admin Login जरूरी है।",true);
    return;
  }

  const typed = $("customKey").value.trim().toUpperCase();

  if(typed && !/^[A-Z0-9-]{4,32}$/.test(typed)){
    msg("Key 4 से 32 अक्षरों की होनी चाहिए।",true);
    return;
  }

  const key = typed || makeKey();
  const days = Number($("duration").value);

  $("generateBtn").disabled = true;

  try{
    const ref = db.ref("Keys/"+key);
    const existing = await ref.once("value");

    if(existing.exists()){
      msg("यह Key पहले से मौजूद है।",true);
      return;
    }

    await ref.set({
      status:"active",
      durationDays:days,
      durationMs:days*86400000,
      createdAt:firebase.database.ServerValue.TIMESTAMP,
      activatedBy:null,
      activatedAt:null,
      expiresAt:null
    });

    latestKey = key;

    $("newKey").classList.remove("hidden");
    $("copyBtn").classList.remove("hidden");
    $("newKey").textContent = key+" | "+days+" दिन";

    $("customKey").value = "";
    msg("नई Key बन गई।");
    await loadKeys();

  }catch(e){
    msg("Error: "+e.message,true);
  }finally{
    $("generateBtn").disabled = false;
  }
};

$("copyBtn").onclick = async()=>{
  if(!latestKey)return;
  try{
    await navigator.clipboard.writeText(latestKey);
    msg("Key Copy हो गई।");
  }catch(e){
    msg("Copy नहीं हुआ। Key को दबाकर Copy करें।",true);
  }
};

// Expired keys को हटाना
async function deleteExpiredKeys(){
  if(!adminCheck())return;

  try{
    const snapshot = await db.ref("Keys").once("value");
    const now = Date.now();
    const updates = {};

    snapshot.forEach(child=>{
      const data = child.val();

      if(data &&
         data.expiresAt &&
         Number(data.expiresAt) <= now){
        updates[child.key] = null;
      }
    });

    if(Object.keys(updates).length > 0){
      await db.ref("Keys").update(updates);
      msg(Object.keys(updates).length+" Expired Keys Delete हुईं।");
    }
  }catch(e){
    msg("Expired Key Delete Error: "+e.message,true);
  }
}

async function loadKeys(){
  if(!adminCheck())return;

  try{
    const snapshot = await db.ref("Keys").once("value");
    let html = "";
    let count = 0;

    snapshot.forEach(child=>{
      count++;

      const key = child.key;
      const data = child.val() || {};
      const status = data.status || "unknown";
      const days = data.durationDays || "-";

      const expires = data.expiresAt
        ? new Date(data.expiresAt).toLocaleString()
        : "अभी Activate नहीं हुई";

      html += `
        <div class="key">
          <b>${escapeHTML(key)}</b><br>
          <span class="small">
            अवधि: ${days} दिन<br>
            Status: ${escapeHTML(status)}<br>
            Expiry: ${escapeHTML(expires)}
          </span>
          <button class="secondary"
            onclick="toggleKey('${encodeURIComponent(key)}','${status}')">
            ${status === "active" ? "DISABLE" : "ENABLE"}
          </button>
        </div>
      `;
    });

    $("keyCount").textContent = "कुल Keys: "+count;
    $("keyList").innerHTML = html || "अभी कोई Key नहीं है।";

  }catch(e){
    msg("Load Error: "+e.message,true);
  }
}

function escapeHTML(value){
  return String(value).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  })[c]);
}

window.toggleKey = async(encodedKey,status)=>{
  if(!adminCheck())return;

  const key = decodeURIComponent(encodedKey);

  try{
    await db.ref("Keys/"+key+"/status").set(
      status === "active" ? "disabled" : "active"
    );
    msg("Key का Status बदल गया।");
    await loadKeys();
  }catch(e){
    msg("Error: "+e.message,true);
  }
};

$("refreshBtn").onclick = async()=>{
  await deleteExpiredKeys();
  await loadKeys();
};

$("logoutBtn").onclick = async()=>{
  await auth.signOut();
  msg("Logout हो गया।");
};
</script>
</body>
</html>
